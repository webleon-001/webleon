<!DOCTYPE html>
<html lang="ja">
<head>
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Web LEON SNAP | v8 Smooth Zoom</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js"></script>
    <style>
        :root { --bg: #0b0c0d; --panel: #16181a; --gold: #d4af37; --border: #2f3337; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: sans-serif; background: var(--bg); color: #f1f1f1; margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; border: 2px solid var(--bg); }
        ::-webkit-scrollbar-thumb:hover { background: var(--gold); }

        header { height: 60px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; flex-shrink: 0; }
        header h1 { font-size: 16px; font-weight: 800; color: var(--gold); letter-spacing: 2px; margin: 0; }
        
        .main-container { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 20px 10px; }
        
        /* 🌟 サムネイルバー（縦スクロールバーを非表示化） */
        .thumbnail-bar { 
            width: 100%; max-width: 1000px; display: flex; gap: 10px; 
            overflow-x: auto; overflow-y: hidden; /* 縦スクロールバーを隠す */
            padding: 0 10px 20px 10px; margin-bottom: 20px; border-bottom: 1px solid #333; scroll-behavior: smooth; 
        }
        /* Webkit系ブラウザで縦スクロールバーの領域ごと完全に消す */
        .thumbnail-bar::-webkit-scrollbar:vertical { display: none; }
        
        .thumb-item { position: relative; height: 80px; min-width: 60px; border: 2px solid #333; flex-shrink: 0; border-radius: 4px; cursor: pointer; }
        .thumb-item.active { border-color: var(--gold); transform: scale(1.05); z-index: 5; }
        .thumb-item img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 2px; }
        
        .thumb-name { position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%); font-size: 10px; color: #fff; background: #111; border: 1px solid var(--border); padding: 2px 6px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 100; }
        .thumb-item:hover .thumb-name { opacity: 1; }

        .workspace { display: flex; flex-direction: column; gap: 30px; width: 100%; max-width: 1050px; align-items: center; margin-bottom: 20px; }
        @media (min-width: 1000px) { 
            .workspace { flex-direction: row; align-items: flex-start; justify-content: center; } 
        }

        .panel-left { display: flex; flex-direction: column; width: fit-content; }
        .panel-right { display: flex; flex-direction: column; align-items: stretch; width: fit-content; gap: 20px; }
        
        .control-bar { display: flex; justify-content: flex-start; align-items: center; width: 100%; }
        .nav-group { display: flex; align-items: center; background: #222; padding: 8px 20px; border-radius: 30px; border: 1px solid var(--border); }
        #counter { font-family: monospace; font-size: 14px; margin: 0 20px; color: var(--gold); }
        .nav-group button { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 0 10px; }
        
        .canvas-card { background: var(--panel); padding: 15px; border-radius: 8px; border: 1px solid var(--border); width: fit-content; max-width: 100%; position: relative; display: flex; flex-direction: column; align-items: center; }
        .canvas-container { position: relative; overflow: hidden; background: #000; border: 1px solid #333; margin: 0 auto; touch-action: none; cursor: move; }
        #containerV { width: 280px; height: 393px; }
        #containerH { width: 320px; height: 168px; }
        @media (min-width: 768px) { #containerV { width: 360px; height: 505px; } #containerH { width: 520px; height: 273px; } }
        canvas { width: 100% !important; height: 100% !important; display: block; }
        
        .zoom-label { position: absolute; top: 25px; right: 25px; background: rgba(0,0,0,0.7); color: var(--gold); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: monospace; z-index: 10; pointer-events: none; border: 1px solid var(--border); opacity: 0; transition: opacity 0.3s ease; }
        .filename-label { margin-top: 10px; font-size: 11px; color: var(--gold); font-family: monospace; text-align: center; width: 100%; }
        
        .action-area { width: 100%; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
        .btn-main { background: var(--gold); color: #000; padding: 15px 10px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; font-size: 13px; white-space: nowrap; flex: 1.8; }
        .btn-sub { background: #222; color: #fff; padding: 15px 10px; border-radius: 8px; border: 1px solid #444; font-weight: bold; cursor: pointer; font-size: 12px; white-space: nowrap; flex: 1; }
        .upload-btn { background: var(--gold); color: #000; padding: 15px 10px; border-radius: 8px; border: none; font-weight: 800; cursor: pointer; font-size: 12px; white-space: nowrap; flex: 0.8; display: inline-flex; align-items: center; justify-content: center; }
        
        #loading { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 2000; }
        
        .progress-bar-container { width: 80%; max-width: 400px; height: 8px; background: #222; border-radius: 4px; margin-top: 20px; overflow: hidden; border: 1px solid var(--border); }
        .progress-bar { width: 0%; height: 100%; background: var(--gold); transition: width 0.2s ease; }
        #progressText { color: var(--gold); font-family: monospace; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

<div id="loading">
    <div style="color:var(--gold); font-weight:800; letter-spacing:2px;">PREPARING ASSETS...</div>
    <div class="progress-bar-container"><div id="progressBar" class="progress-bar"></div></div>
    <div id="progressText">Analyzing files...</div>
</div>

<header>
    <h1>Web LEON SNAP</h1>
</header>

<div class="main-container">
    
    <div class="thumbnail-bar" id="thumbBar"></div>

    <div class="workspace">
        <div class="panel-left">
            <div class="canvas-card">
                <div id="zoomV" class="zoom-label">1.0x</div>
                <div id="containerV" class="canvas-container"><canvas id="canvasV" width="1200" height="1686"></canvas></div>
                <div id="nameV" class="filename-label">---</div>
            </div>
        </div>
        
        <div class="panel-right">
            <div class="control-bar">
                <div class="nav-group">
                    <button onclick="switchImage(currentIndex - 1)">◀</button>
                    <span id="counter">00 / 00</span>
                    <button onclick="switchImage(currentIndex + 1)">▶</button>
                </div>
            </div>
            
            <div class="canvas-card">
                <div id="zoomH" class="zoom-label">1.0x</div>
                <div id="containerH" class="canvas-container"><canvas id="canvasH" width="1200" height="630"></canvas></div>
                <div id="nameH" class="filename-label">---</div>
            </div>
            
            <div class="action-area">
                <button onclick="downloadAllAsZip()" class="btn-sub">ZIPで保存</button>
                <button onclick="downloadSingleImage()" class="btn-sub">この画像を保存</button>
                <button onclick="exportToFolder()" class="btn-main">フォルダを選択して全保存</button>
                <label class="upload-btn">素材追加<input type="file" id="fileInput" accept=".zip, image/*" multiple style="display:none;"></label>
            </div>
        </div>
    </div>
    
</div>

<script>
    let images = [];
    let currentIndex = -1;
    const targets = { canvasV: { w: 1200, h: 1686, maxScaleMult: 3 }, canvasH: { w: 1200, h: 630, maxScaleMult: 5 } };
    
    let zoomTimeouts = { canvasV: null, canvasH: null };

    document.getElementById('thumbBar').addEventListener('wheel', function(e) {
        if (e.deltaY !== 0) {
            e.preventDefault();
            this.scrollLeft += e.deltaY;
        }
    });

    document.getElementById('fileInput').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files);
        if (!files.length) return;
        
        const loadingScreen = document.getElementById('loading');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        
        loadingScreen.style.display = 'flex';
        progressBar.style.width = '0%';
        progressText.innerText = 'Analyzing files...';
        
        const prevLength = images.length;
        let filesToProcess = []; 
        
        for (const file of files) {
            if (file.name.toLowerCase().endsWith('.zip')) {
                try {
                    const zip = await JSZip.loadAsync(file);
                    for (const [name, entry] of Object.entries(zip.files)) {
                        if (!entry.dir && !name.includes('__MACOSX')) {
                            const ext = name.split('.').pop().toLowerCase();
                            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'heif'].includes(ext)) {
                                filesToProcess.push({ type: 'zip', entry, name });
                            }
                        }
                    }
                } catch(err) {
                    console.error("ZIP load error:", err);
                    alert("ZIPファイルの読み込みに失敗しました。");
                }
            } else { 
                const ext = file.name.split('.').pop().toLowerCase();
                if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'heif'].includes(ext)) {
                    filesToProcess.push({ type: 'file', file, name: file.name });
                }
            }
        }
        
        const totalFiles = filesToProcess.length;
        if (totalFiles === 0) {
            loadingScreen.style.display = 'none';
            e.target.value = '';
            return;
        }

        let processedCount = 0;
        progressText.innerText = `0 / ${totalFiles} (0%)`;
        
        for (const item of filesToProcess) {
            if (item.type === 'zip') {
                const blob = await item.entry.async("blob");
                await processFile(blob, item.name);
            } else {
                await processFile(item.file, item.name);
            }
            
            processedCount++;
            const percent = Math.round((processedCount / totalFiles) * 100);
            progressBar.style.width = percent + '%';
            progressText.innerText = `${processedCount} / ${totalFiles} (${percent}%)`;
        }
        
        loadingScreen.style.display = 'none';
        
        const newLength = images.length;
        if (newLength > prevLength) {
            switchImage(prevLength === 0 ? 0 : prevLength);
        } else {
            renderThumbs();
        }
        
        e.target.value = '';
    });

    async function processFile(blob, name) {
        const ext = name.split('.').pop().toLowerCase();
        if (!['jpg', 'jpeg', 'png', 'gif', 'webp', 'heic', 'heif'].includes(ext)) return;

        let url = URL.createObjectURL(blob);
        try {
            if (['heic','heif'].includes(ext)) {
                const conv = await heic2any({ blob, toType: "image/jpeg" });
                const finalBlob = Array.isArray(conv) ? conv[0] : conv;
                url = URL.createObjectURL(finalBlob);
            }
            const fullImg = await new ImageLoader(url);
            const pvCanvas = document.createElement('canvas');
            const pvCtx = pvCanvas.getContext('2d');
            const pvScale = 0.66;
            pvCanvas.width = fullImg.width * pvScale;
            pvCanvas.height = fullImg.height * pvScale;
            pvCtx.drawImage(fullImg, 0, 0, pvCanvas.width, pvCanvas.height);
            const pvImg = await new ImageLoader(pvCanvas.toDataURL('image/jpeg', 0.8));

            images.push({
                name: name.split('/').pop().split('.')[0],
                originalName: name.split('/').pop(),
                fullImg: fullImg,
                pvImg: pvImg,
                states: { canvasV: getInitial(pvImg, 'canvasV'), canvasH: getInitial(pvImg, 'canvasH') }
            });
        } catch(e) { 
            console.error("Error processing file:", name, e); 
        }
    }

    function ImageLoader(src) {
        return new Promise((resolve, reject) => { 
            const i = new Image(); 
            i.onload = () => resolve(i); 
            i.onerror = () => reject(new Error("Image Load Error"));
            i.src = src; 
        });
    }

    function getInitial(img, id) {
        const t = targets[id];
        const minS = Math.max(t.w / img.width, t.h / img.height);
        
        if (id === 'canvasH') {
            const s = minS * 2.5; 
            let targetY = (t.h / 2) - (img.height * 0.85 * s);
            targetY = Math.min(0, Math.max(targetY, t.h - (img.height * s)));
            return { scale: s, x: (t.w - img.width * s) / 2, y: targetY, minScale: minS, maxScale: minS * t.maxScaleMult };
        }
        
        return { scale: minS, x: (t.w - img.width * minS) / 2, y: (t.h - img.height * minS) / 2, minScale: minS, maxScale: minS * t.maxScaleMult };
    }

    function draw() {
        if (currentIndex < 0) return;
        ['canvasV', 'canvasH'].forEach(id => {
            const c = document.getElementById(id), ctx = c.getContext('2d'), s = images[currentIndex].states[id], img = images[currentIndex].pvImg;
            ctx.fillStyle = "#111"; ctx.fillRect(0,0,c.width,c.height);
            ctx.drawImage(img, s.x, s.y, img.width * s.scale, img.height * s.scale);
            const displayZoom = (s.scale / s.minScale).toFixed(1);
            document.getElementById(id === 'canvasV' ? 'zoomV' : 'zoomH').innerText = `${displayZoom}x`;
        });
    }

    function showZoomLabel(id) {
        const labelId = id === 'canvasV' ? 'zoomV' : 'zoomH';
        const labelEl = document.getElementById(labelId);
        labelEl.style.opacity = '1';
        
        clearTimeout(zoomTimeouts[id]);
        zoomTimeouts[id] = setTimeout(() => {
            labelEl.style.opacity = '0';
        }, 1000); 
    }

    function switchImage(i) {
        if (i < 0 || i >= images.length || i === currentIndex) return;

        if (currentIndex >= 0) {
            ['canvasV', 'canvasH'].forEach(id => {
                const c = document.getElementById(id);
                const container = c.parentElement;

                const overlay = document.createElement('canvas');
                overlay.width = c.width;
                overlay.height = c.height;
                overlay.style.position = 'absolute';
                overlay.style.top = '0';
                overlay.style.left = '0';
                overlay.style.width = '100%';
                overlay.style.height = '100%';
                overlay.style.pointerEvents = 'none';
                overlay.style.transition = 'opacity 0.3s ease';
                overlay.style.zIndex = '5';
                
                overlay.getContext('2d').drawImage(c, 0, 0);
                container.appendChild(overlay);

                requestAnimationFrame(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        if (container.contains(overlay)) container.removeChild(overlay);
                    }, 300);
                });
            });
        }

        currentIndex = i;
        document.getElementById('nameV').innerText = images[i].name + ".jpg";
        document.getElementById('nameH').innerText = images[i].name + "_og.jpg";
        document.getElementById('counter').innerText = `${String(i+1).padStart(2,'0')} / ${String(images.length).padStart(2,'0')}`;
        
        draw(); 
        renderThumbs();

        setTimeout(() => {
            const activeThumb = document.querySelector('.thumb-item.active');
            if (activeThumb) {
                activeThumb.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            }
        }, 10);
    }

    function renderThumbs() {
        const bar = document.getElementById('thumbBar'); bar.innerHTML = '';
        images.forEach((img, i) => {
            const d = document.createElement('div'); d.className = `thumb-item ${i===currentIndex?'active':''}`;
            d.innerHTML = `<img src="${img.pvImg.src}"><span class="thumb-name">${img.originalName}</span>`;
            d.onclick = () => switchImage(i);
            bar.appendChild(d);
        });
    }

    ['canvasV', 'canvasH'].forEach(id => {
        const c = document.getElementById(id);
        let isDragging = false, lastX, lastY, lastDist;

        const handleMove = (x, y, dist = 0) => {
            if (!isDragging || currentIndex < 0) return;
            const s = images[currentIndex].states[id], img = images[currentIndex].pvImg;
            const rect = c.getBoundingClientRect(), ratio = targets[id].w / rect.width;

            if (dist > 0 && lastDist > 0) {
                const factor = 1 + (dist / lastDist - 1) * 0.75; 
                const oldS = s.scale;
                s.scale = Math.min(s.maxScale, Math.max(s.minScale, s.scale * factor));
                s.x = (targets[id].w/2) - ((targets[id].w/2) - s.x) * (s.scale / oldS);
                s.y = (targets[id].h/2) - ((targets[id].h/2) - s.y) * (s.scale / oldS);
            } else {
                s.x += (x - lastX) * ratio; s.y += (y - lastY) * ratio;
            }

            const iw = img.width * s.scale, ih = img.height * s.scale;
            s.x = Math.min(0, Math.max(s.x, targets[id].w - iw));
            s.y = Math.min(0, Math.max(s.y, targets[id].h - ih));
            lastX = x; lastY = y; lastDist = dist; 
            draw();
            showZoomLabel(id); 
        };

        c.addEventListener('mousedown', e => { isDragging = true; lastX = e.clientX; lastY = e.clientY; });
        window.addEventListener('mousemove', e => handleMove(e.clientX, e.clientY));
        window.addEventListener('mouseup', () => isDragging = false);
        c.addEventListener('touchstart', e => {
            isDragging = true;
            if (e.touches.length === 2) lastDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
        }, {passive: false});
        c.addEventListener('touchmove', e => {
            e.preventDefault();
            let d = 0; if (e.touches.length === 2) d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            handleMove(e.touches[0].clientX, e.touches[0].clientY, d);
        }, {passive: false});
        c.addEventListener('touchend', () => isDragging = false);

        c.addEventListener('wheel', e => {
            e.preventDefault();
            const s = images[currentIndex].states[id], rect = c.getBoundingClientRect(), oldS = s.scale;
            const factor = e.deltaY > 0 ? 0.925 : 1.075; 
            s.scale = Math.min(s.maxScale, Math.max(s.minScale, s.scale * factor));
            const mx = (e.clientX - rect.left) * (targets[id].w / rect.width);
            const my = (e.clientY - rect.top) * (targets[id].h / rect.height);
            s.x = mx - (mx - s.x) * (s.scale / oldS);
            s.y = my - (my - s.y) * (s.scale / oldS);
            const img = images[currentIndex].pvImg;
            s.x = Math.min(0, Math.max(s.x, targets[id].w - (img.width * s.scale)));
            s.y = Math.min(0, Math.max(s.y, targets[id].h - (img.height * s.scale)));
            draw();
            showZoomLabel(id); 
        }, {passive: false});
    });

    async function downloadSingleImage() {
        if (currentIndex < 0) return alert("画像がありません");
        
        const loadingScreen = document.getElementById('loading');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        loadingScreen.style.display = 'flex';
        progressBar.style.width = '50%';
        progressText.innerText = 'Saving single image...';
        
        try {
            const item = images[currentIndex];
            const blobV = await getBlob(item, 'canvasV');
            const linkV = document.createElement('a');
            linkV.href = URL.createObjectURL(blobV);
            linkV.download = item.name + ".jpg";
            linkV.click();

            await new Promise(resolve => setTimeout(resolve, 300));
            progressBar.style.width = '100%';

            const blobH = await getBlob(item, 'canvasH');
            const linkH = document.createElement('a');
            linkH.href = URL.createObjectURL(blobH);
            linkH.download = item.name + "_og.jpg";
            linkH.click();
            
        } catch (error) {
            console.error(error);
            alert("単体画像の保存中にエラーが発生しました。");
        }
        
        loadingScreen.style.display = 'none';
    }

    async function exportToFolder() {
        if (!window.showDirectoryPicker) return alert("ZIP保存を使用してください");
        const root = await window.showDirectoryPicker();
        
        const loadingScreen = document.getElementById('loading');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        loadingScreen.style.display = 'flex';
        
        let savedCount = 0;
        const total = images.length;
        
        for (const item of images) {
            await saveFile(root, item.name + ".jpg", 'canvasV', item);
            await saveFile(root, item.name + "_og.jpg", 'canvasH', item);
            
            savedCount++;
            const percent = Math.round((savedCount / total) * 100);
            progressBar.style.width = percent + '%';
            progressText.innerText = `Saving to Folder: ${savedCount} / ${total} (${percent}%)`;
        }
        loadingScreen.style.display = 'none';
    }
    
    async function saveFile(dir, name, id, item) {
        const c = document.createElement('canvas'); c.width = targets[id].w; c.height = targets[id].h;
        const ctx = c.getContext('2d'); const s = item.states[id];
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
        
        ctx.drawImage(item.fullImg, s.x, s.y, item.pvImg.width * s.scale, item.pvImg.height * s.scale);
        
        const b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
        const h = await dir.getFileHandle(name, {create:true}); const w = await h.createWritable(); await w.write(b); await w.close();
    }
    
    async function downloadAllAsZip() {
        const loadingScreen = document.getElementById('loading');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        loadingScreen.style.display = 'flex';
        progressBar.style.width = '0%';
        
        const zip = new JSZip();
        let zippedCount = 0;
        const total = images.length;
        
        for (const item of images) {
            zip.file(item.name + ".jpg", await getBlob(item, 'canvasV'));
            zip.file(item.name + "_og.jpg", await getBlob(item, 'canvasH'));
            
            zippedCount++;
            const percent = Math.round((zippedCount / total) * 100);
            progressBar.style.width = percent + '%';
            progressText.innerText = `Compressing ZIP: ${zippedCount} / ${total} (${percent}%)`;
        }
        
        progressText.innerText = "Generating ZIP file...";
        const content = await zip.generateAsync({type:"blob"});
        const link = document.createElement('a'); link.href = URL.createObjectURL(content); 
        
        link.download = "webleon_snaps.zip"; 
        
        link.click();
        loadingScreen.style.display = 'none';
    }
    
    async function getBlob(item, id) {
        const c = document.createElement('canvas'); c.width = targets[id].w; c.height = targets[id].h;
        const ctx = c.getContext('2d'); const s = item.states[id];
        ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,c.height);
        
        ctx.drawImage(item.fullImg, s.x, s.y, item.pvImg.width * s.scale, item.pvImg.height * s.scale);
        
        return new Promise(r => c.toBlob(r, 'image/jpeg', 0.9));
    }
</script>
</body>
</html>
